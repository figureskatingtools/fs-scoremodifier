[pytest]
testpaths = tests
filterwarnings =
    error::DeprecationWarning
    # PyMuPDF's legacy `import fitz` alias warns on import; the package is
    # imported by that name throughout (see scoremodifier/ and function_app.py).
    ignore:The `fitz` API is deprecated:DeprecationWarning
    ignore::DeprecationWarning:fitz
    ignore::DeprecationWarning:azure
    ignore::DeprecationWarning:cryptography
    ignore::DeprecationWarning:google
