name: Deploy to Azure

on:
  # Push to main auto-deploys prod. test is deployed only via manual dispatch
  # (run the workflow from the branch whose code you want to deploy).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        type: choice
        options:
          - test
          - prod
        default: test

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  set-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
    steps:
      - name: Set environment name
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env_name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
          fi

  deploy-infra:
    name: Deploy Infrastructure
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}
    outputs:
      function_app_name: ${{ steps.deploy.outputs.functionAppName }}
      function_principal_id: ${{ steps.deploy.outputs.functionPrincipalId }}
      storage_account_name: ${{ steps.deploy.outputs.storageAccountName }}
      resource_group_name: ${{ steps.deploy.outputs.resourceGroupName }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        id: deploy
        run: |
          DEPLOYMENT_NAME="deploy-fs-scoremodifier-$(date +%s)"

          OUTPUT=$(az deployment sub create \
            --location "${{ vars.LOCATION }}" \
            --template-file infra/main.bicep \
            --name "$DEPLOYMENT_NAME" \
            --parameters \
              resourceGroupName="${{ vars.RESOURCE_GROUP_NAME }}" \
              proxySharedSecret="${{ secrets.PROXY_SHARED_SECRET }}" \
            --query 'properties.outputs' \
            -o json)

          echo "functionAppName=$(echo "$OUTPUT" | jq -r '.functionAppName.value')" >> "$GITHUB_OUTPUT"
          echo "functionPrincipalId=$(echo "$OUTPUT" | jq -r '.functionPrincipalId.value')" >> "$GITHUB_OUTPUT"
          echo "storageAccountName=$(echo "$OUTPUT" | jq -r '.storageAccountName.value')" >> "$GITHUB_OUTPUT"
          echo "resourceGroupName=$(echo "$OUTPUT" | jq -r '.resourceGroupName.value')" >> "$GITHUB_OUTPUT"

      - name: Summarise backend outputs
        run: |
          {
            echo "### Score Modifier backend"
            echo ""
            echo "| Output | Value |"
            echo "| --- | --- |"
            echo "| Function App | \`${{ steps.deploy.outputs.functionAppName }}\` |"
            echo "| Function App URL | \`https://${{ steps.deploy.outputs.functionAppName }}.azurewebsites.net\` |"
            echo "| Function principal id | \`${{ steps.deploy.outputs.functionPrincipalId }}\` |"
            echo ""
            echo "Set these in the **figureskatingtools-site** repo's \`${{ needs.set-environment.outputs.env_name }}\` environment as"
            echo "\`FUNCTION_APP_URL_SCOREMODIFIER\` and \`TOOL_PRINCIPAL_ID_SCOREMODIFIER\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-backend:
    name: Deploy Backend (Functions)
    needs: [set-environment, deploy-infra]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build backend package
        run: |
          BUILD_DIR=$(mktemp -d)
          cp -r infra/functions/* "$BUILD_DIR/"
          # Bundle the canonical core package so the function can import it.
          cp -r scoremodifier "$BUILD_DIR/scoremodifier"

          cd "$BUILD_DIR"
          rm -rf .venv __pycache__ .git .vscode *.pyc local.settings.json
          rm -f test_*.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          mkdir -p .python_packages/lib/site-packages
          pip install -r requirements.txt --target .python_packages/lib/site-packages

          zip -r "$GITHUB_WORKSPACE/backend.zip" .

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        run: |
          FUNC_APP_NAME="${{ needs.deploy-infra.outputs.function_app_name }}"
          RESOURCE_GROUP="${{ needs.deploy-infra.outputs.resource_group_name }}"

          az functionapp deployment source config-zip \
            --src backend.zip \
            --name "$FUNC_APP_NAME" \
            --resource-group "$RESOURCE_GROUP"
