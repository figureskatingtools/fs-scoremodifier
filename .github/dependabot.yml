# Dependabot version updates. Weekly, grouped into one PR per ecosystem, opened
# against `main` like any feature branch: ci.yml runs the tests on the PR, the
# code owner reviews it, and the branch can be dispatched to the `test`
# environment before merging (merging deploys prod).
#
# NOTE: this file is only read from the default branch (main).
# NOTE: frontend/ is a pre-migration leftover that is no longer built or
# deployed (the UI lives in figureskatingtools-site), so it is not watched.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/infra/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Helsinki"
    groups:
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Helsinki"
    groups:
      actions-dependencies:
        patterns:
          - "*"
